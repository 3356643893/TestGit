[pytest]

# 1. 基础路径
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 2. 命令行默认参数
# 注意：alluredir / junitxml / log_file 由各 run_*.py 脚本显式指定
# 直接运行 pytest 时不自动生成报告（避免意外覆盖）
addopts =
    -s
    #--reruns 2
    #--reruns-delay 1
    --tb=short

# 3. 日志级别和输出格式
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# 4. 忽略特定的警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 5. 自定义标签
markers =
    smoke: 冒烟测试，核心流程用例
    regression: 全量回归用例
    p0: P0核心高优先级用例
    p1: P1中优先级用例
    normal: 普通优先级用例
    slow: 执行耗时较长的用例
    pressure: 压力测试
    ui: UI 测试
    api: API 测试
    env: 多环境测试
    allure_label: allure label marker
    allure_link: allure link marker
    allure_description: allure description
    allure_description_html: allure description html
    blocker: allure severity blocker
    critical: allure severity critical
    minor: allure severity minor
    trivial: allure severity trivial