version: "1.0"
name: "python-pipeline"
displayName: "Python自动化测试流水线"

triggers:
  push:
    branches:
      - master

stages:
  - stage: build_and_test
    displayName: "环境准备 & 执行测试"
    trigger: auto
    strategy: naturally
    steps:
      - step: build@python
        name: "install_and_test"
        displayName: "安装依赖 & 运行测试"
        pythonVersion: "3.11"
        commands:
          - echo "=== 确认工作目录 ==="
          - pwd
          - ls -la

          - echo "=== 清理旧报告 ==="
          - rm -rf reports
          - mkdir -p reports/allure-results reports/logs reports/screenshots

          - echo "=== 安装依赖 ==="
          - pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

          - echo "=== 生成环境配置 ==="
          - cp config/env.yaml.example config/env.yaml

          - echo "=== 验证环境 ==="
          - python -m pytest --version
          - pip show allure-pytest

          - echo "=== 执行测试 ==="
          - python -m pytest

      - step: publish@general_artifacts
        name: "upload_allure_results"
        displayName: "上传 Allure 测试报告"
        artifactName: "allure-results"
        path: "reports/allure-results"